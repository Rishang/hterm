version: "3"

tasks:
  ui:
    desc: Build the Svelte UI
    dir: ui
    cmds:
      - pnpm install
      - pnpm run build
    sources:
      - src/**/*
      - vendor/**/*
      - index.html
      - package.json
      - vite.config.js
    generates:
      - dist/**/*

  build:
    desc: Build the release binary
    deps: [ui]
    cmds:
      - cp openapi.yaml ui/dist/openapi.yaml
      - cargo fmt --check
      - '{{default "cargo" .CARGO}} build --release {{.CLI_ARGS}}'
    sources:
      - src/**/*.rs
      - Cargo.toml
      - Cargo.lock
      - ui/dist/**/*
      - openapi.yaml
    generates:
      - target/release/hterm

  ghostty-web:
    desc: Rebuild the vendored ghostty-web from source (needs Zig 0.15.2)
    cmds:
      - ui/vendor/ghostty-web/build.sh

  sync:skills:
    desc: Upgrade agent-browser and sync its skill into .claude/skills/agent-browser
    preconditions:
      - sh: command -v agent-browser
        msg: "agent-browser is not installed: npm i -g agent-browser && agent-browser install"
    cmds:
      - agent-browser upgrade
      - mkdir -p .claude/skills/agent-browser
      - cp "$(agent-browser skills path agent-browser)/SKILL.md" .claude/skills/agent-browser/SKILL.md

  dev:
    desc: Run the dev server
    cmds:
      - cargo run -- -W

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean
      - cd ui && rm -rf dist node_modules
