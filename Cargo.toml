[package]
name        = "hterm"
version     = "0.1.0"
edition     = "2021"
description = "Share your terminal over the web"

[dependencies]
# axum-server provides real TLS via rustls — no OpenSSL dependency required.
axum        = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
tokio       = { version = "1.53.1", features = ["rt", "macros", "net", "sync", "time", "io-util", "io-std", "fs", "signal", "process"] }
bytes       = "1.12.1"                       # zero-copy slices; used directly in ws.rs
serde       = { version = "1.0.229", features = ["derive"] }
serde_json  = "1.0.151"
serde_yaml  = "0.9.34"
clap        = { version = "4.6.6", features = ["derive"] }
# "user" adds nix::unistd::{setuid, setgid, Uid, Gid} for privilege drop.
# "inotify" backs the file-explorer change watcher — kernel-driven, so no polling.
nix         = { version = "0.31.3", features = ["term", "process", "signal", "user", "inotify"] }
tracing     = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures     = "0.3.33"
rust-embed  = { version = "8.12.0", features = ["mime-guess"] }
mime_guess  = "2.0.5"
uuid = { version = "1.24.0", default-features = false, features = ["v4"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[profile.release]
opt-level     = "z"     # optimise for binary size
lto           = true    # link-time optimisation
codegen-units = 1       # single CGU — required for full LTO
panic         = "abort"
strip         = true
